appId: com.rildomar.glacialpoint
productName: GlacialPoint
asar: true
# O runtime do Electron vem do cache do proprio electron-builder, sem depender
# dos scripts de instalacao do npm (o node_modules pode nao ter o dist).
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - dist-electron/**/*.cjs
  - assets/icon.png
  - licenses/**/*
  - LICENSE
  - THIRD_PARTY_NOTICES.md
win:
  icon: assets/icon.ico
  # NSIS (.exe) e MSI: formatos de instalador para download direto.
  target:
    - nsis
    - msi
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
msi:
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Fixo para que versoes novas atualizem a instalacao em vez de duplicar.
  upgradeCode: "{1B03D6A3-6A03-4E19-94DA-67023E8ED062}"
mac:
  icon: assets/icon.icns
  target: dmg
  category: public.app-category.utilities
